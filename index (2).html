<style>
:root{
  --bg:#e3e8ee; --panel:#f6f8fa; --line:#cfd6de; --ink:#1d2430; --muted:#5c6776;
  --accent:#0f8b8d; --accent-ink:#fff; --stage:#c9d1da;
}
@media (prefers-color-scheme:dark){
  :root{ --bg:#1b1f26; --panel:#252a33; --line:#394150; --ink:#e8ecf2; --muted:#9aa5b5; --accent:#33b5b7; --accent-ink:#0b1416; --stage:#14171c; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
/* position:fixed + inset:0 = always exactly the visible screen on iPad Safari / home-screen app */
body{position:fixed;inset:0;font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;touch-action:manipulation;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{font:inherit;color:inherit}
button{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;min-height:40px;cursor:pointer;touch-action:manipulation}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}

header{flex:none;display:flex;flex-wrap:nowrap;gap:16px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line);overflow-x:auto;-webkit-overflow-scrolling:touch}
header>*{flex:none}
.group{display:flex;align-items:center;gap:8px}
.group label{color:var(--muted)}
input[type=range]{width:120px;accent-color:var(--accent);touch-action:none}
input[type=color]{width:46px;height:40px;padding:0;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer}
#hex{width:92px;height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:16px;-webkit-user-select:text;user-select:text}
.swatches{display:flex;gap:6px}
.sw{width:28px;height:28px;min-height:0;border-radius:50%;padding:0;border:2px solid var(--panel);box-shadow:0 0 0 1px var(--line)}
.spacer{flex:1;min-width:0}

main{flex:1;display:flex;min-height:0;min-width:0}
#tools{flex:none;display:flex;flex-direction:column;gap:6px;padding:8px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto}
#tools button{width:96px;text-align:left}
#stage{flex:1;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;background:var(--stage);position:relative;overflow:hidden}
#paper{position:relative;flex:none;width:300px;height:200px;box-shadow:0 2px 14px rgba(0,0,0,.28);touch-action:none;cursor:none}
#paper canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
#stroke{pointer-events:none}
#ring{position:fixed;border:1.5px solid #000;border-radius:50%;box-shadow:0 0 0 1px #fff;pointer-events:none;display:none;transform:translate(-50%,-50%);z-index:5}

#split{flex:none;width:16px;background:var(--panel);border-left:1px solid var(--line);cursor:col-resize;touch-action:none;position:relative}
#split::after{content:"";position:absolute;left:50%;top:50%;width:4px;height:44px;margin:-22px 0 0 -2px;border-radius:2px;background:var(--muted);opacity:.6}
#ref{flex:none;width:var(--refw,320px);display:flex;flex-direction:column;background:var(--panel);border-left:1px solid var(--line);min-width:0}
#ref.hidden,#split.hidden{display:none}
.refbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:8px;border-bottom:1px solid var(--line)}
#refview{flex:1;overflow:auto;-webkit-overflow-scrolling:touch;display:flex;align-items:flex-start;justify-content:center;padding:8px;touch-action:pan-x pan-y}
#refview.drag{outline:3px dashed var(--accent);outline-offset:-8px}
#refimg{display:none;max-width:none;cursor:crosshair}
#empty{color:var(--muted);text-align:center;margin:auto;padding:16px}
.hint{color:var(--muted);font-size:12px;padding:4px 8px 8px}

/* Portrait / narrow: tools on top row, reference at the bottom */
@media (max-width:820px){
  main{flex-direction:column}
  #tools{flex-direction:row;overflow-x:auto;overflow-y:hidden;border-right:0;border-bottom:1px solid var(--line)}
  #tools button{width:auto;white-space:nowrap}
  #split{width:auto;height:16px;border-left:0;border-top:1px solid var(--line);cursor:row-resize}
  #split::after{width:44px;height:4px;margin:-2px 0 0 -22px}
  #ref{width:100%;height:var(--refh,34vh);border-left:0}
}
</style>
</head>
<body>
<header>
  <div class="group">
    <input type="color" id="color" value="#d6336c" aria-label="Color">
    <input id="hex" value="#d6336c" maxlength="7" aria-label="Hex color" autocapitalize="off" autocorrect="off" spellcheck="false">
    <div class="swatches" id="swatches"></div>
  </div>
  <div class="group"><label for="size">Size</label><input type="range" id="size" min="1" max="120" value="6"><span id="sizeV">6</span></div>
  <div class="group"><label for="opac">Opacity</label><input type="range" id="opac" min="5" max="100" value="100"><span id="opacV">100</span></div>
  <span class="spacer"></span>
  <div class="group">
    <button id="undo" title="Ctrl+Z">Undo</button>
    <button id="redo" title="Ctrl+Y">Redo</button>
    <button id="clear">Clear</button>
    <button id="save">Save PNG</button>
    <button id="toggleRef">Reference</button>
  </div>
</header>

<main>
  <nav id="tools" aria-label="Brushes"></nav>
  <section id="stage">
    <div id="paper"><canvas id="main"></canvas><canvas id="stroke"></canvas></div>
  </section>
  <div id="split" role="separator" aria-label="Resize reference panel"></div>
  <aside id="ref">
    <div class="refbar">
      <button id="pick">Add image</button>
      <button id="zoomOut" aria-label="Zoom out">−</button>
      <button id="zoomIn" aria-label="Zoom in">+</button>
      <button id="fit">Fit</button>
      <button id="removeRef">Remove</button>
      <input type="file" id="file" accept="image/*" hidden>
    </div>
    <div id="refview">
      <div id="empty">Drop an image here, paste one (Ctrl+V), or press Add image.</div>
      <img id="refimg" alt="Reference image">
    </div>
    <div class="hint">Tap the reference to pick a color from it. Drag the handle to resize the panel.</div>
  </aside>
</main>
<div id="ring"></div>

<script>
let W = 1400, H = 900;
const SCALE = 1.5;            // canvas pixels per screen pixel (sharp on iPad, light on memory)
const MAX_PIXELS = 6.5e6;
const $ = id => document.getElementById(id);
const main = $('main'), stroke = $('stroke'), paper = $('paper'), ring = $('ring'), stage = $('stage');
main.width = stroke.width = W; main.height = stroke.height = H;
const mctx = main.getContext('2d', { willReadFrequently: true });
const sctx = stroke.getContext('2d');
mctx.fillStyle = '#fff'; mctx.fillRect(0, 0, W, H);

/* ---------- Brushes ---------- */
const BRUSHES = {
  pen:      { name: 'Pen',         layer: true,  size: 4,  opac: 100 },
  marker:   { name: 'Marker',      layer: true,  size: 24, opac: 60 },
  callig:   { name: 'Calligraphy', layer: true,  size: 16, opac: 100 },
  airbrush: { name: 'Airbrush',    layer: false, size: 50, opac: 100 },
  water:    { name: 'Watercolor',  layer: false, size: 60, opac: 60 },
  spray:    { name: 'Spray',       layer: false, size: 50, opac: 100 },
  eraser:   { name: 'Eraser',      layer: false, size: 30, opac: 100 }
};
let brush = 'pen', color = '#d6336c', size = 6, opac = 100;

const tools = $('tools');
for (const k in BRUSHES) {
  const b = document.createElement('button');
  b.textContent = BRUSHES[k].name; b.dataset.k = k;
  b.onclick = () => selectBrush(k);
  tools.appendChild(b);
}
function selectBrush(k) {
  brush = k;
  setSize(BRUSHES[k].size); setOpac(BRUSHES[k].opac);
  [...tools.children].forEach(b => b.classList.toggle('on', b.dataset.k === k));
}
function setSize(v) { size = +v; $('size').value = size; $('sizeV').textContent = size; updateRing(); }
function setOpac(v) { opac = +v; $('opac').value = opac; $('opacV').textContent = opac; }
$('size').oninput = e => setSize(e.target.value);
$('opac').oninput = e => setOpac(e.target.value);

/* ---------- Color ---------- */
function setColor(c) {
  if (!/^#[0-9a-f]{6}$/i.test(c)) return;
  color = c.toLowerCase(); $('color').value = color; $('hex').value = color;
}
$('color').oninput = e => setColor(e.target.value);
$('hex').oninput = e => { let v = e.target.value.trim(); if (v[0] !== '#') v = '#' + v; setColor(v); };
['#000000','#ffffff','#e03131','#f76707','#fab005','#74b816','#0ca678','#1c7ed6','#4263eb','#9c36b5','#d6336c','#8d6e63'].forEach(c => {
  const s = document.createElement('button');
  s.className = 'sw'; s.style.background = c; s.setAttribute('aria-label', c);
  s.onclick = () => setColor(c); $('swatches').appendChild(s);
});

/* ---------- Layout: the paper grows to fill the whole stage ---------- */
function growCanvas(nw, nh) {
  const tmp = document.createElement('canvas'); tmp.width = W; tmp.height = H;
  tmp.getContext('2d').drawImage(main, 0, 0);
  W = nw; H = nh;
  main.width = stroke.width = W; main.height = stroke.height = H;
  mctx.fillStyle = '#fff'; mctx.fillRect(0, 0, W, H);
  mctx.drawImage(tmp, 0, 0);
}
function fit() {
  const pad = 8;
  const sw = stage.clientWidth - pad, sh = stage.clientHeight - pad;
  if (sw < 50 || sh < 50) { requestAnimationFrame(fit); return; }
  if (!drawing) {
    const nw = Math.max(W, Math.ceil(sw * SCALE)), nh = Math.max(H, Math.ceil(sh * SCALE));
    if ((nw > W || nh > H) && nw * nh <= MAX_PIXELS) growCanvas(nw, nh);
  }
  const s = Math.min(sw / W, sh / H);
  paper.style.width = Math.floor(W * s) + 'px';
  paper.style.height = Math.floor(H * s) + 'px';
  updateRing();
}
new ResizeObserver(fit).observe(stage);
addEventListener('resize', fit);
addEventListener('orientationchange', () => setTimeout(fit, 250));
if (window.visualViewport) visualViewport.addEventListener('resize', fit);

/* ---------- Undo / redo ---------- */
const undoS = [], redoS = [], LIMIT = 10;
function snap() { undoS.push(mctx.getImageData(0, 0, W, H)); if (undoS.length > LIMIT) undoS.shift(); redoS.length = 0; }
function undo() { if (!undoS.length) return; redoS.push(mctx.getImageData(0, 0, W, H)); mctx.putImageData(undoS.pop(), 0, 0); }
function redo() { if (!redoS.length) return; undoS.push(mctx.getImageData(0, 0, W, H)); mctx.putImageData(redoS.pop(), 0, 0); }
$('undo').onclick = undo; $('redo').onclick = redo;
$('clear').onclick = () => { snap(); mctx.fillStyle = '#fff'; mctx.fillRect(0, 0, W, H); };
$('save').onclick = () => {
  main.toBlob(async blob => {
    if (!blob) return;
    const file = new File([blob], 'doodle.png', { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file] }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a'); a.download = 'doodle.png'; a.href = URL.createObjectURL(blob); a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  }, 'image/png');
};
addEventListener('keydown', e => {
  if (e.target.id === 'hex') return;
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  else if (e.key === '[') setSize(Math.max(1, size - 2));
  else if (e.key === ']') setSize(Math.min(120, size + 2));
});

/* ---------- Drawing ---------- */
let drawing = false, last = null, activeId = null, penSeen = false;
const pos = e => { const r = main.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
const rnd = (a, b) => a + Math.random() * (b - a);

function stamp(ctx, x, y, p) {
  const r = Math.max(0.5, size / 2 * p);
  ctx.fillStyle = color;
  switch (brush) {
    case 'pen': case 'marker':
      ctx.globalAlpha = 1; ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); break;
    case 'callig':
      ctx.globalAlpha = 1; ctx.save(); ctx.translate(x, y); ctx.rotate(-0.8);
      ctx.beginPath(); ctx.ellipse(0, 0, r, Math.max(0.6, r * 0.22), 0, 0, 7); ctx.fill(); ctx.restore(); break;
    case 'airbrush': {
      const g = ctx.createRadialGradient(x, y, 0, x, y, r);
      g.addColorStop(0, color); g.addColorStop(1, color + '00');
      ctx.globalAlpha = opac / 100 * 0.18; ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(x, y, r, 0, 7); ctx.fill(); break;
    }
    case 'water': {
      const a = opac / 100;
      ctx.globalAlpha = a * 0.07;
      for (let i = 0; i < 3; i++) {
        ctx.beginPath(); ctx.arc(x + rnd(-r, r) * 0.25, y + rnd(-r, r) * 0.25, r * rnd(0.75, 1), 0, 7); ctx.fill();
      }
      ctx.globalAlpha = a * 0.05; ctx.strokeStyle = color; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, r * 0.95, 0, 7); ctx.stroke(); break;
    }
    case 'spray':
      ctx.globalAlpha = opac / 100;
      for (let i = 0; i < 6; i++) {
        const a = rnd(0, 6.283), d = r * Math.sqrt(Math.random());
        ctx.fillRect(x + Math.cos(a) * d, y + Math.sin(a) * d, 1.4, 1.4);
      } break;
    case 'eraser':
      ctx.globalAlpha = 1; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, size / 2, 0, 7); ctx.fill(); break;
  }
  ctx.globalAlpha = 1;
}
function strokeTo(a, b, p) {
  const ctx = BRUSHES[brush].layer ? sctx : mctx;
  const gap = brush === 'spray' ? 3 : Math.max(1, size * 0.12);
  const d = Math.hypot(b.x - a.x, b.y - a.y), n = Math.max(1, Math.ceil(d / gap));
  for (let i = 1; i <= n; i++) stamp(ctx, a.x + (b.x - a.x) * i / n, a.y + (b.y - a.y) * i / n, p);
}

paper.addEventListener('pointerdown', e => {
  if (e.pointerType === 'pen') penSeen = true;
  if (e.pointerType === 'touch' && penSeen) return;   // palm rejection once an Apple Pencil has been used
  if (e.button > 0 || drawing) return;
  e.preventDefault();
  paper.setPointerCapture(e.pointerId);
  activeId = e.pointerId;
  snap(); drawing = true;
  if (BRUSHES[brush].layer) stroke.style.opacity = opac / 100;
  last = pos(e);
  strokeTo(last, last, pressure(e));
});
paper.addEventListener('pointermove', e => {
  if (e.pointerType === 'pen') penSeen = true;
  moveRing(e);
  if (!drawing || e.pointerId !== activeId) return;
  e.preventDefault();
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
  for (const ev of (evs.length ? evs : [e])) { const p = pos(ev); strokeTo(last, p, pressure(ev)); last = p; }
});
function pressure(e) { return e.pointerType === 'pen' ? 0.25 + 0.75 * (e.pressure || 0.5) : 1; }
function endStroke(e) {
  if (!drawing || (e && e.pointerId !== activeId)) return;
  drawing = false; activeId = null;
  if (BRUSHES[brush].layer) {
    mctx.globalAlpha = opac / 100; mctx.drawImage(stroke, 0, 0); mctx.globalAlpha = 1;
    sctx.clearRect(0, 0, W, H); stroke.style.opacity = 1;
  }
}
paper.addEventListener('pointerup', endStroke);
paper.addEventListener('pointercancel', endStroke);
paper.addEventListener('contextmenu', e => e.preventDefault());
paper.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
document.addEventListener('gesturestart', e => e.preventDefault());   // no accidental pinch-zoom of the page

/* ---------- Brush cursor ---------- */
function updateRing() {
  const d = Math.max(4, size * paper.clientWidth / W);
  ring.style.width = ring.style.height = d + 'px';
}
function moveRing(e) {
  if (e.pointerType === 'touch') { ring.style.display = 'none'; return; }
  ring.style.display = 'block'; ring.style.left = e.clientX + 'px'; ring.style.top = e.clientY + 'px';
}
paper.addEventListener('pointerenter', moveRing);
paper.addEventListener('pointerleave', () => { if (!drawing) ring.style.display = 'none'; });

/* ---------- Reference panel ---------- */
const img = $('refimg'), view = $('refview'), refEl = $('ref'), split = $('split');
let zoom = 1, sampler = null;
function loadRef(file) {
  if (!file || !file.type.startsWith('image/')) return;
  const url = URL.createObjectURL(file);
  img.onload = () => {
    $('empty').style.display = 'none'; img.style.display = 'block';
    sampler = document.createElement('canvas'); sampler.width = img.naturalWidth; sampler.height = img.naturalHeight;
    sampler.getContext('2d', { willReadFrequently: true }).drawImage(img, 0, 0);
    fitRef();
  };
  img.src = url;
  refEl.classList.remove('hidden'); split.classList.remove('hidden');
}
function fitRef() { zoom = Math.min(1, (view.clientWidth - 16) / img.naturalWidth); applyZoom(); }
function applyZoom() { img.style.width = img.naturalWidth * zoom + 'px'; }
$('pick').onclick = () => $('file').click();
$('file').onchange = e => { loadRef(e.target.files[0]); e.target.value = ''; };
$('zoomIn').onclick = () => { zoom = Math.min(8, zoom * 1.25); applyZoom(); };
$('zoomOut').onclick = () => { zoom = Math.max(0.05, zoom / 1.25); applyZoom(); };
$('fit').onclick = () => img.naturalWidth && fitRef();
$('removeRef').onclick = () => { img.removeAttribute('src'); img.style.display = 'none'; $('empty').style.display = ''; sampler = null; };
$('toggleRef').onclick = () => { refEl.classList.toggle('hidden'); split.classList.toggle('hidden'); setTimeout(fit, 0); };

/* drag handle to resize the reference panel (works with touch / Pencil) */
const isColumn = () => matchMedia('(max-width:820px)').matches;
let resizing = false;
split.addEventListener('pointerdown', e => { resizing = true; split.setPointerCapture(e.pointerId); e.preventDefault(); });
split.addEventListener('pointermove', e => {
  if (!resizing) return;
  const r = document.querySelector('main').getBoundingClientRect();
  if (isColumn()) {
    const h = Math.min(Math.max(r.bottom - e.clientY - 16, 140), r.height * 0.7);
    document.documentElement.style.setProperty('--refh', h + 'px');
  } else {
    const w = Math.min(Math.max(r.right - e.clientX - 16, 200), r.width * 0.7);
    document.documentElement.style.setProperty('--refw', w + 'px');
  }
});
const stopResize = () => { resizing = false; };
split.addEventListener('pointerup', stopResize); split.addEventListener('pointercancel', stopResize);

addEventListener('dragover', e => { e.preventDefault(); view.classList.add('drag'); });
addEventListener('dragleave', e => { if (!e.relatedTarget) view.classList.remove('drag'); });
addEventListener('drop', e => { e.preventDefault(); view.classList.remove('drag'); loadRef(e.dataTransfer.files[0]); });
addEventListener('paste', e => {
  for (const it of e.clipboardData.items) if (it.type.startsWith('image/')) { loadRef(it.getAsFile()); break; }
});
img.addEventListener('click', e => {
  if (!sampler) return;
  const r = img.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * sampler.width);
  const y = Math.floor((e.clientY - r.top) / r.height * sampler.height);
  const [R, G, B] = sampler.getContext('2d').getImageData(x, y, 1, 1).data;
  setColor('#' + [R, G, B].map(v => v.toString(16).padStart(2, '0')).join(''));
});

selectBrush('pen'); setColor('#d6336c'); fit();
</script>
</body>
</html>
